<style>
/* Layout : l'affiche en entier, puis la réservation en dessous, sur le même chocolat que l'affiche */
:root{
  --choco:#36200f; --choco-2:#442812; --ivory:#f6eee2; --ivory-mute:rgba(246,238,226,.72);
  --gold:#d9bf8f; --gold-btn-1:#f0dcb2; --gold-btn-2:#cfa96b; --line:rgba(246,238,226,.26);
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif; --sans:Jost,"Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
html{background:var(--choco)}
body{background:var(--choco);color:var(--ivory);font-family:var(--sans);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 32px}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.lang{display:flex;justify-content:flex-end;gap:2px}
.lang button{border:1px solid var(--line);background:transparent;color:var(--ivory-mute);font:500 11px var(--sans);letter-spacing:.12em;padding:6px 11px;border-radius:99px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ivory);border-color:var(--ivory);color:var(--choco)}
.poster{display:block;width:100%;height:auto;max-width:100%;border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.book{display:flex;flex-direction:column;gap:14px;text-align:center}
.eyebrow{font:500 10.5px var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
h1{margin:0;font:500 38px/1 var(--serif);text-wrap:balance}
.date{margin:-6px 0 0;font:italic 400 19px/1.3 var(--serif);color:var(--ivory)}
.intro{margin:0;font:400 14px/1.6 var(--sans);color:var(--ivory-mute);text-wrap:pretty}
.days{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.days button{padding:12px 6px 11px;border:1px solid var(--line);border-radius:12px;background:rgba(255,236,200,.05);color:var(--ivory);cursor:pointer;font:italic 400 19px/1.1 var(--serif)}
.days button small{display:block;margin-top:4px;font:500 9px var(--sans);font-style:normal;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.days button[aria-pressed="true"]{background:linear-gradient(180deg,var(--gold-btn-1),var(--gold-btn-2));border-color:transparent;color:#3a2010;box-shadow:0 6px 16px rgba(176,127,51,.35)}
.days button[aria-pressed="true"] small{color:#3a2010}
.days button:disabled{opacity:.4;cursor:default}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.slots button{padding:11px 0;border:1px solid var(--line);border-radius:11px;background:transparent;color:var(--ivory);font:500 13px var(--sans);font-variant-numeric:tabular-nums;cursor:pointer;transition:background .15s,color .15s}
.slots button[aria-pressed="true"]{background:var(--ivory);border-color:var(--ivory);color:var(--choco)}
.slots button:disabled{cursor:default;opacity:.45;border-style:dashed}
.slots button small{display:block;font:500 8.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;margin-top:2px;opacity:.9}
label.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
input{width:100%;box-sizing:border-box;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:rgba(246,238,226,.06);color:var(--ivory);font:400 16px var(--sans)}
input::placeholder{color:rgba(246,238,226,.5)}
.err{min-height:18px;margin:-6px 0 -4px;font:400 12.5px var(--sans);color:#f0b49a}
.go{display:flex;align-items:center;justify-content:center;gap:9px;padding:16px;border-radius:99px;background:linear-gradient(180deg,var(--gold-btn-1),var(--gold-btn-2));color:var(--choco);font:500 13.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;text-decoration:none}
.go svg{width:19px;height:19px;flex:none}
.go[aria-disabled="true"]{opacity:.55}
.dm{color:var(--ivory-mute);font:400 13.5px var(--sans);text-decoration:underline;text-underline-offset:3px}
.info{margin:6px 0 0;padding-top:16px;border-top:1px solid var(--line);font:400 12.5px/1.7 var(--sans);color:var(--ivory-mute)}
.info b{font-weight:500;color:var(--ivory);user-select:all;-webkit-user-select:all;letter-spacing:.04em}
sup.r{font-size:.62em;letter-spacing:0;vertical-align:.55em;margin-left:.1em}
.sig{font:400 13px var(--serif);letter-spacing:.3em;color:var(--gold);text-transform:uppercase}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (max-width:360px){.slots{grid-template-columns:repeat(4,minmax(0,1fr))}h1{font-size:34px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box}img{max-width:100%}[hidden]{display:none!important}body{margin:0}</style>
<style>
/* Édition du 11 novembre : la page prend le tabac de l'affiche et l'or des bijoux */
:root{--tabac-1:#6a4428;--tabac-2:#553420;--tabac-3:#3c2415;--gold:#e2c07f;--gold-btn-1:#f6e1ad;--gold-btn-2:#d3a24f;--gold-btn-3:#b07f33;--line:rgba(226,192,127,.42)}
html,body{background:var(--tabac-3)}
body{background:linear-gradient(180deg,var(--tabac-1) 0%,var(--tabac-2) 38%,var(--tabac-3) 100%) fixed}
.poster{box-shadow:0 22px 60px rgba(30,14,4,.55)}
.lang button{border-color:var(--line)}
.lang button[aria-pressed="true"]{background:linear-gradient(180deg,var(--gold-btn-1),var(--gold-btn-2));border-color:transparent;color:#3a2010}
.slots button{border-color:var(--line);background:rgba(255,236,200,.05)}
.slots button:hover{border-color:var(--gold)}
.slots button[aria-pressed="true"]{background:linear-gradient(180deg,var(--gold-btn-1),var(--gold-btn-2));border-color:transparent;color:#3a2010;box-shadow:0 6px 16px rgba(176,127,51,.35)}
input{border-color:var(--line);background:rgba(255,236,200,.07)}
input:focus{border-color:var(--gold);outline:none}
.go,.go[aria-disabled="true"]{opacity:1;background:linear-gradient(180deg,var(--gold-btn-1) 0%,var(--gold-btn-2) 55%,var(--gold-btn-3) 100%);color:#3a2010;box-shadow:0 10px 26px rgba(176,127,51,.4),inset 0 1px 0 rgba(255,255,255,.55)}
.info{border-top-color:var(--line)}
</style>

<body>

<div class="wrap">
  <div class="lang" role="group" aria-label="Language"><button type="button" id="lgEn" aria-pressed="true">EN</button><button type="button" id="lgFr" aria-pressed="false">FR</button></div>
  <img class="poster" id="poster" alt="Piercing Party Loubichka, 11 &amp; 12 November, 2 to 8 pm" src="/a/pp/affiche-11-12.jpg">
  <section class="book" aria-labelledby="ttl">
    <span class="eyebrow">Loubichka<sup class="r">®</sup> · The Art of Ear Styling</span>
    <h1 id="ttl">Piercing Party</h1>
    <p class="date" id="date"></p>
    <p class="intro" id="intro"></p>
    <span class="eyebrow" id="pick"></span>
    <div class="days" id="days" role="group"></div>
    <div class="slots" id="slots" role="group"></div>
    <label class="sr" for="name" id="nameLbl"></label>
    <input id="name" autocomplete="given-name">
    <p class="err" id="err" aria-live="polite"></p>
    <a class="go" id="go" href="https://wa.me/212661435742" target="_blank" rel="noopener" aria-disabled="true"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.1.7.5-.1 1.5-.6 1.7-1.2s.2-1.1.2-1.2-.2-.2-.4-.3Z"/></svg><span id="goT"></span></a>
    <a class="dm" id="dm" href="https://ig.me/m/loubichka" target="_blank" rel="noopener"></a>
    <p class="info" id="info"></p>
    <span class="sig">Loubichka<sup class="r">®</sup></span>
  </section>
</div>
<script>
const WA_NUM='212661435742'; /* numéro WhatsApp de la maison : à changer ici uniquement */
(()=>{
const $=id=>document.getElementById(id);
const SL=['14:00','14:30','15:00','15:30','16:00','16:30','17:00','17:30','18:00','18:30','19:00','19:30'];
/* Deux journées : mercredi 11 et jeudi 12 novembre. Créneaux complets par jour dans /creneaux.json */
const DAYS=[{d:'2026-11-11',fr:'Mercredi 11 novembre',frs:'Mercredi 11',en:'Wednesday, November 11',ens:'Wed. 11'},{d:'2026-11-12',fr:'Jeudi 12 novembre',frs:'Jeudi 12',en:'Thursday, November 12',ens:'Thu. 12'}];
let FULLD={'2026-11-11':[],'2026-11-12':[]};
const past=(d,t)=>{try{return new Date(d+'T'+t+':00')<=new Date()}catch(_){return false}};
const free=d=>SL.filter(s=>!FULLD[d.d].includes(s)&&!past(d.d,s));
let day=(DAYS.find(d=>free(d).length)||DAYS[DAYS.length-1]);
let lang='fr',slot=null;
try{const l=localStorage.getItem('pp_lang');if(l==='fr'||l==='en')lang=l}catch(_){}
const T={
 en:{date:'Wednesday 11 & Thursday 12 November · 2 – 8 PM',intro:'Come pierce and style your ear with Loubichka at the showroom. Limited spots, by appointment only.',pick:'Choose your day and time',name:'Your first name',go:'Book on WhatsApp',dm:'I’d rather book via Instagram DM',
   info:'The Loubichka Showroom · Casablanca',err:'Please choose a time first.',alt:'Piercing Party Loubichka, 11 & 12 November, 2 to 8 pm',grp:'Time slots',
   msg:(t,n)=>`Hello Loubichka,\nI would like to book my spot at the Piercing Party on ${day.en} at ${t}.${n?'\nFirst name: '+n:''}`},
 fr:{date:'Mercredi 11 & jeudi 12 novembre · 14h – 20h',intro:'Viens percer et composer ton oreille avec Loubichka au showroom. Places limitées, uniquement sur rendez-vous.',pick:'Choisis ton jour et ton créneau',name:'Ton prénom',go:'Réserver sur WhatsApp',dm:'Je préfère réserver en DM Instagram',
   info:'Showroom Loubichka · Casablanca',err:'Choisis d’abord ton créneau.',alt:'Piercing Party Loubichka, 11 et 12 novembre, de 14h à 20h',grp:'Créneaux',
   msg:(t,n)=>`Bonjour Loubichka,\nJe souhaite réserver ma place à la Piercing Party du ${day.fr.toLowerCase()} à ${t}.${n?'\nPrénom : '+n:''}`}};
const lbl=t=>{if(lang==='fr')return t.replace(':','h');let[h,m]=t.split(':').map(Number);return (h>12?h-12:h)+(m?':'+String(m).padStart(2,'0'):'')+' PM'};
function link(){const g=$('go');const n=$('name').value.trim();
  if(!slot){g.href='https://wa.me/'+WA_NUM;g.setAttribute('aria-disabled','true');return}
  g.removeAttribute('aria-disabled');g.href='https://wa.me/'+WA_NUM+'?text='+encodeURIComponent(T[lang].msg(lbl(slot),n)+REF)}
/* Source de la visite : loubichka.com/piercing-party/?src=pub ajoute « Réf. PP11-PUB » au message, pour compter les réservations venues de la publicité */
const REF=(()=>{try{const v=new URLSearchParams(location.search).get('src');if(!v)return '';const c=v.replace(/[^a-z0-9]/gi,'').toUpperCase().slice(0,8);if(c)sessionStorage.setItem('pp_src',c);return c?'\nRéf. PP11-'+c:''}catch(_){return ''}})()||(()=>{try{const c=sessionStorage.getItem('pp_src');return c?'\nRéf. PP11-'+c:''}catch(_){return ''}})();
function render(){const t=T[lang];document.documentElement.lang=lang;
  $('date').textContent=t.date;$('intro').textContent=t.intro;$('pick').textContent=t.pick;$('name').placeholder=t.name;$('nameLbl').textContent=t.name;
  $('goT').textContent=t.go;$('dm').textContent=t.dm;$('info').innerHTML=t.info;$('poster').alt=t.alt;$('slots').setAttribute('aria-label',t.grp);
  $('lgEn').setAttribute('aria-pressed',lang==='en');$('lgFr').setAttribute('aria-pressed',lang==='fr');
  $('days').innerHTML=DAYS.map((d,i)=>`<button type="button" data-i="${i}" aria-pressed="${d===day}" ${free(d).length?'':'disabled'}>${lang==='fr'?d.frs:d.ens}<small>${free(d).length?(lang==='fr'?'14h – 20h':'2 – 8 PM'):(SL.every(t=>past(d.d,t))?(lang==='fr'?'Terminé':'Over'):(lang==='fr'?'Complet':'Full'))}</small></button>`).join('');
  $('days').setAttribute('aria-label',lang==='fr'?'Jour':'Day');
  $('days').querySelectorAll('button:not(:disabled)').forEach(b=>b.onclick=()=>{day=DAYS[+b.dataset.i];slot=null;render()});
  const FULL=FULLD[day.d];
  $('slots').innerHTML=SL.map(s=>past(day.d,s)&&!FULL.includes(s)?`<button type="button" data-t="${s}" disabled>${lbl(s)}<small>${lang==='fr'?'Passé':'Past'}</small></button>`:FULL.includes(s)?`<button type="button" data-t="${s}" disabled aria-label="${lbl(s)} ${lang==='fr'?'complet':'full'}">${lbl(s)}<small>${lang==='fr'?'Complet':'Full'}</small></button>`:`<button type="button" data-t="${s}" aria-pressed="${s===slot}">${lbl(s)}</button>`).join('');
  $('slots').querySelectorAll('button:not(:disabled)').forEach(b=>b.onclick=()=>{slot=b.dataset.t;$('err').textContent='';$('slots').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));link()});
  if($('err').textContent)$('err').textContent=t.err;link()}
const setLang=l=>{lang=l;try{localStorage.setItem('pp_lang',l)}catch(_){}render()};
$('lgEn').onclick=()=>setLang('en');$('lgFr').onclick=()=>setLang('fr');
$('name').addEventListener('input',link);
$('go').addEventListener('click',e=>{if(!slot){e.preventDefault();$('err').textContent=T[lang].err;const f=$('slots').querySelector('button:not(:disabled)');if(f)f.focus()}});
render();
fetch('https://loubichka.com/creneaux.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{if(d.jours&&typeof d.jours==='object'){DAYS.forEach(x=>{if(Array.isArray(d.jours[x.d]))FULLD[x.d]=d.jours[x.d]})}else if(Array.isArray(d.complets))FULLD['2026-11-11']=d.complets;if(slot&&FULLD[day.d].includes(slot))slot=null;if(!free(day).length){const n=DAYS.find(x=>free(x).length);if(n){day=n;slot=null}}render()}).catch(()=>{});
})();
</script>

</body>
</html>
