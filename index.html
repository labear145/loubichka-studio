/* ---------- entrée ---------- */
body.pre .sheet{transform:translateY(105%)}
body.pre .top{opacity:0}
#intro{position:fixed;inset:0;z-index:100;overflow:hidden;background:#000}
#ii{position:absolute;transform-origin:0 0;transition:transform 1.7s cubic-bezier(.65,0,.25,1),filter 2s ease .3s;filter:brightness(.8) saturate(1.04) contrast(1.03);will-change:transform}
#ii img{display:block;width:100%;height:100%;animation:breathe 14s ease-out forwards}
@keyframes breathe{from{transform:scale(1.08)}to{transform:scale(1)}}
#iveil{position:absolute;inset:0;background:radial-gradient(95% 65% at 50% 48%,rgba(0,0,0,0),rgba(0,0,0,.55) 100%),linear-gradient(180deg,rgba(0,0,0,.6),rgba(0,0,0,0) 26%,rgba(0,0,0,0) 66%,rgba(0,0,0,.9));transition:opacity 1.2s;animation:veil 2.4s ease forwards}
@keyframes veil{from{background-color:#000}to{background-color:rgba(0,0,0,0)}}
#isweep{position:absolute;inset:0;background:linear-gradient(115deg,rgba(225,235,245,0) 42%,rgba(225,235,245,.16) 50%,rgba(225,235,245,0) 58%);background-size:300% 100%;animation:isw 5.5s 1.4s cubic-bezier(.45,0,.2,1) infinite;mix-blend-mode:screen}
@keyframes isw{0%{background-position:100% 0}60%,100%{background-position:0 0}}
#itx{position:absolute;left:0;right:0;top:calc(18% + env(safe-area-inset-top,0px));text-align:center;transition:opacity .8s}
#itx h1{margin:0;font:500 clamp(30px,9.4vw,44px)/1 var(--serif);color:var(--iv);white-space:nowrap;letter-spacing:.9em;padding-left:.9em;opacity:0;animation:ls 2.6s .5s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes ls{to{letter-spacing:.38em;padding-left:.38em;opacity:1}}

@keyframes rl{to{width:64px}}

#ibot{position:absolute;left:0;right:0;bottom:calc(36px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:16px;padding:0 max(24px,env(safe-area-inset-left,0px));transition:opacity .6s}
#ieid{margin:0;font:italic 300 19px/1.4 var(--serif);color:var(--iv2);text-align:center;opacity:0;animation:fd 1.4s 2.4s forwards;max-width:300px}
#enter{width:min(100%,300px);padding:17px;border:1px solid rgba(245,241,234,.4);background:rgba(245,241,234,.06);-webkit-backdrop-filter:blur(18px) saturate(1.2);backdrop-filter:blur(18px) saturate(1.2);color:var(--iv);font:400 10.5px var(--sans);letter-spacing:.36em;padding-left:calc(17px + .36em);text-transform:uppercase;opacity:0;animation:fd 1.4s 2.8s forwards;transition:background .4s}
#enter:active{background:rgba(245,241,234,.16)}
#ihint{opacity:0;animation:fd 1.4s 3.2s forwards;color:var(--iv3);font-size:8.5px}
@keyframes fd{to{opacity:1}}
#intro.go #itx,#intro.go #ibot,#intro.go #isweep{opacity:0}
#intro.go #iveil{opacity:0}
#intro.go #ii{filter:none}
#intro.fade{opacity:0;transition:opacity .6s}
#intro.go{background:transparent}

/* ---------- Ear ID ---------- */
#cardv{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:rgba(30,16,9,.9);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);opacity:0;pointer-events:none;transition:opacity .5s}

:focus-visible{outline:1px solid var(--iv);outline-offset:3px}

/* ---------- mon oreille ---------- */
#imy{opacity:0;animation:fd 1.4s 3s forwards;font:400 9.5px var(--sans);letter-spacing:.26em;text-transform:uppercase;color:var(--iv);padding:4px 0 5px;border-bottom:1px solid rgba(245,241,234,.45)}

.tips li i{flex:none;font:italic 400 22px/1 var(--serif);color:var(--champ);font-style:italic;width:18px}
.priv{margin:12px 0 4px;font:300 10.5px/1.5 var(--sans);color:var(--iv3);text-align:center}

/* ---------- entrée : le miroir ---------- */
#ii,#iveil,#isweep,#imy,.myb,.myr{display:none!important}
#intro{background:#000}
#itx{top:calc(26px + env(safe-area-inset-top,0px))!important}

#itx .rule{margin:14px auto 10px!important}
#mir{position:absolute;left:50%;top:calc(118px + env(safe-area-inset-top,0px));--h:min(calc(100dvh - 330px),470px);width:calc(var(--h) * .65);transform:translateX(-50%);opacity:0;animation:mirIn 2.2s .9s cubic-bezier(.2,.7,.2,1) forwards;transition:opacity .9s,transform 1.4s cubic-bezier(.65,0,.25,1)}
@keyframes mirIn{from{opacity:0;transform:translateX(-50%) translateY(14px)}to{opacity:1;transform:translateX(-50%)}}
#mir .mf{position:relative;height:var(--h);border-radius:999px 999px 3px 3px;overflow:hidden;box-shadow:0 0 0 1px rgba(205,185,149,.55),0 0 0 6px #000,0 0 0 7px rgba(205,185,149,.18),0 40px 90px rgba(0,0,0,.9)}
#mir .mf img{display:block;width:100%;height:100%;object-fit:cover}
#mir .mf::after{content:'';position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 40%,rgba(0,0,0,0) 55%,rgba(0,0,0,.45));pointer-events:none}
#mir .msw{position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,0) 40%,rgba(255,250,240,.22) 50%,rgba(255,255,255,0) 60%);background-size:320% 100%;mix-blend-mode:screen;animation:isw 6.5s 2.6s cubic-bezier(.45,0,.2,1) infinite;z-index:2}

#ieid{font-size:17px!important}

/* ---------- entrée Chanel : noir, le logo en relief comme sur l'écrin, puis en ivoire ---------- */

#intro{background:#000!important}

/* ---------- mes piercings ---------- */
.hbar{position:absolute;z-index:15;left:50%;top:12px;transform:translate(-50%,-8px);width:min(92%,360px);padding:12px 14px 12px;background:rgba(55,31,18,.72);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(205,185,149,.45);text-align:center;opacity:0;pointer-events:none;transition:opacity .5s,transform .5s}
body.holes .hbar{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.hbar b{display:block;font:italic 400 20px/1.15 var(--serif);color:var(--iv)}
.hbar small{display:block;margin-top:3px;font:400 8.5px var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--champ)}
.hbar div{display:flex;justify-content:center;gap:22px;margin-top:10px}

.hbar button.ok{color:var(--champ);border-bottom-color:var(--champ)}
body.holes .side,body.holes .pill,body.holes .swh{opacity:0!important;pointer-events:none!important}
body.holes .hs{pointer-events:auto!important;opacity:1!important}

/* ---------------- Cherry Chain : la chaîne se redessine entre les deux embouts (repris de la V4) ---------------- */
const CHU={rose:'a/chainlink-rose.webp',jaune:'a/chainlink-jaune.webp',blanc:'a/chainlink-blanc.webp'};
const CHA={cherry:[102,410],cherry2:[77,247]},CH_L=1620,CH_P=96,CH_TW=74,CH_MM=46;
const chBox=document.createElement('div');chBox.className='lay';chBox.style.zIndex=5;FR.after(chBox);
function chPairs(list){const a=list.filter(o=>o.id==='cherry'),b=list.filter(o=>o.id==='cherry2');return a.map((o,i)=>[o,b[i]]).filter(x=>x[1])}
function chAtt(p){const j=J[p.id],s=p.s||1,f=j.t*s/j.w,a=CHA[p.id],r=(p.r||0)*Math.PI/180;let dx=(a[0]-j.ax*j.w)*f,dy=(a[1]-j.ay*j.h)*f;[dx,dy]=[dx*Math.cos(r)-dy*Math.sin(r),dx*Math.sin(r)+dy*Math.cos(r)];return[p.x+dx,p.y*ASP+dy]}
function chPts(a,b){const s=a.s||1,f=1.62/CH_MM*s,L=CH_L*f,P_=CH_P*f,TW=CH_TW*f,A=chAtt(a),B=chAtt(b);
  const xm=(A[0]+B[0])/2,bz=(P0,P1,P2,P3,t)=>{const u=1-t;return[u*u*u*P0[0]+3*u*u*t*P1[0]+3*u*t*t*P2[0]+t*t*t*P3[0],u*u*u*P0[1]+3*u*u*t*P1[1]+3*u*t*t*P2[1]+t*t*t*P3[1]]};
  const half=(E,ym,n)=>{const M=[xm,ym],c1=[E[0],E[1]+(ym-E[1])*.55],c2=[xm+(E[0]-xm)*.55,ym],o=[];for(let i=0;i<=n;i++)o.push(bz(E,c1,c2,M,i/n));return o};
  const curve=(ym,n)=>half(A,ym,n).concat(half(B,ym,n).reverse().slice(1));
  const len=ym=>{const q=curve(ym,32);let l=0;for(let i=1;i<q.length;i++)l+=Math.hypot(q[i][0]-q[i-1][0],q[i][1]-q[i-1][1]);return l};
  let pts;if(Math.hypot(B[0]-A[0],B[1]-A[1])>=L){pts=[];for(let i=0;i<=240;i++)pts.push([A[0]+(B[0]-A[0])*i/240,A[1]+(B[1]-A[1])*i/240])}
  else{let lo=Math.max(A[1],B[1]),hi=lo+L;for(let k=0;k<34;k++){const md=(lo+hi)/2;if(len(md)<L)lo=md;else hi=md}pts=curve(lo,120)}
  const out=[];let acc=0,next=P_/2;
  for(let i=1;i<pts.length;i++){const p0=pts[i-1],p1=pts[i],d=Math.hypot(p1[0]-p0[0],p1[1]-p0[1]);
    while(next<=acc+d){const tt=(next-acc)/d;out.push([p0[0]+(p1[0]-p0[0])*tt,(p0[1]+(p1[1]-p0[1])*tt)/ASP,Math.atan2(p1[1]-p0[1],p1[0]-p0[0])*180/Math.PI-90,TW]);next+=P_}acc+=d}
  return out}
function drawChains(){chBox.innerHTML=chPairs(P).map(([a,b])=>chPts(a,b).map(([x,y,an,tw])=>`<div class="pc" style="left:${x}%;top:${y}%;width:${tw}%;transform:translate(-50%,-50%) rotate(${an}deg)"><img src="${CHU[a.c]||CHU.rose}" alt=""></div>`).join('')).join('')}

window.SND=(()=>{const mu=$('#dmus');const G={on:.7,low:.22,off:0};let lvl='off',ctx=null,g=null,started=false,ducked=false;
  try{const v=localStorage.getItem('lbx_snd');if(v in G)lvl=v}catch(_){}

  const gain=(v,ms)=>{if(g&&ctx){const t=ctx.currentTime;try{g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(g.gain.value,t);g.gain.linearRampToValueAtTime(v,t+ms/1000)}catch(_){g.gain.value=v}}else{try{mu.volume=v}catch(_){}}};
  const arm=()=>{const f=()=>{removeEventListener('pointerdown',f,true);if(!started&&lvl!=='off'&&!ducked)play()};addEventListener('pointerdown',f,true)};
  function play(){if(lvl==='off'||ducked)return;graph();try{if(ctx&&ctx.state==='suspended')ctx.resume()}catch(_){}mu.preload='auto';if(!g)try{mu.volume=0}catch(_){}
    let pr;try{pr=mu.play()}catch(_){}started=true;if(pr&&pr.catch)pr.catch(()=>{started=false;arm()});gain(G[lvl],1800);ui()}

    if(l==='off'){gain(0,500);setTimeout(()=>{if(lvl==='off')try{mu.pause()}catch(_){}},560)}else if(mu.paused)play();else gain(G[l],500);ui();
    if(!quiet)try{toast(E()?(l==='on'?'Music on':l==='low'?'Music softly':'Music off'):(l==='on'?'Musique':l==='low'?'Musique douce':'Musique coupée'))}catch(_){}}
  function ui(){const b=$('#sndb');if(!b)return;b.dataset.l=lvl;b.setAttribute('aria-label',E()?'Music':'Musique')}
  function duck(on){ducked=on;if(on){gain(0,350);setTimeout(()=>{if(ducked)try{mu.pause()}catch(_){}},400)}else if(lvl!=='off')play()}
  function demo(){if(lvl==='off')set('on',true);else if(mu.paused)play()}
  $('#sndb').addEventListener('click',e=>{e.stopPropagation();set(lvl==='on'?'low':lvl==='low'?'off':'on')});
  document.addEventListener('visibilitychange',()=>{if(document.hidden){try{mu.pause()}catch(_){}}else if(started&&lvl!=='off'&&!ducked){try{const pr=mu.play();if(pr&&pr.catch)pr.catch(()=>{})}catch(_){}}});
  $('#enter').addEventListener('click',play);ui();
  return{play,set,duck,demo,get level(){return lvl}}})();
